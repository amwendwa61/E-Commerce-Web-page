<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Urban Flames</title>

<style>
body{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, Helvetica, sans-serif;
}

body{
background:#111;
color:#fff;
scroll-behavior:auto
}

header{
background:#000;
padding:15px 5%;
display:flex;
justify-content:space-between;
align-items:center;
position:fixed;
width:100%;
top:0;
z-index:1000;
}

header h1{
color:#ff4500;
}

nav a{
color:white;
margin-left:20px;
text-decoration:none;
font-weight:bold;
}

nav a:hover{
color:#ff4500;
}

.hero{
height:100vh;
background:linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)),
url('https://images.unsplash.com/photo-1555992336-cbf94c9df6f6');
background-size:cover;
background-position:center;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:20px;
}

.hero h2{
font-size:50px;
color:#ff4500;
}

.hero p{
margin:20px 0;
font-size:20px;
}

.btn{
background:#ff4500;
color:white;
padding:12px 25px;
border:none;
cursor:pointer;
font-size:16px;
border-radius:5px;
}

.btn:hover{
background:#e03e00;
}

section{
padding:100px 5% 60px 5%;
}

.menu-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

.menu-item{
background:#1a1a1a;
padding:20px;
border-radius:10px;
text-align:center;
}

.menu-item img{
width:100%;
height:200px;
object-fit:cover;
border-radius:10px;
}

.menu-item h3{
margin:15px 0;
color:#ff4500;
}

.cart{
position:fixed;
right:20px;
bottom:20px;
background:#ff4500;
padding:15px;
border-radius:50%;
cursor:pointer;
font-weight:bold;
}

.cart-count{
background:black;
padding:3px 8px;
border-radius:50%;
margin-left:5px;
}

footer{
background:#000;
text-align:center;
padding:20px;
}

input, textarea{
width:100%;
padding:10px;
margin-top:10px;
border-radius:5px;
border:none;
}

form button{
margin-top:10px;
}

.modal{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.8);
justify-content:center;
align-items:center;
}

.modal-content{
background:#1a1a1a;
padding:20px;
width:300px;
border-radius:10px;
}
</style>
</head>

<body>

<header>
<h1>Urban Flames</h1>
<nav>
<a href="#home">Home</a>
<a href="#menu">Menu</a>
<a href="#contact">Contact</a>
</nav>
</header>

<section class="hero" id="home">
<h2>Welcome to Urban Flames 🔥</h2>
<p>Grilled to perfection. Served with passion.</p>
<button class="btn" onclick="scrollToMenu()">Order Now</button>
</section>

<section id="menu">
<h2 style="text-align:center;margin-bottom:40px;color:#ff4500;">Our Menu</h2>

<div class="menu-grid">

<div class="menu-item">
<img src="https://images.unsplash.com/photo-1550547660-d9450f859349">
<h3>Classic Burger</h3>
<p>KES 650</p>
<button class="btn" onclick="addToCart('Classic Burger',650)">Add to Cart</button>
</div>

<div class="menu-item">
<img src="https://images.unsplash.com/photo-1544025162-d76694265947">
<h3>BBQ Chicken</h3>
<p>KES 850</p>
<button class="btn" onclick="addToCart('BBQ Chicken',850)">Add to Cart</button>
</div>

<div class="menu-item">
<img src="https://images.unsplash.com/photo-1604908176997-431dd47f96c4">
<h3>Flame Pizza</h3>
<p>KES 1200</p>
<button class="btn" onclick="addToCart('Flame Pizza',1200)">Add to Cart</button>
</div>

</div>
</section>

<section id="contact">
<h2 style="text-align:center;color:#ff4500;">Contact Us</h2>
<form onsubmit="submitForm(event)">
<input type="text" placeholder="Your Name" required>
<input type="email" placeholder="Your Email" required>
<textarea rows="5" placeholder="Your Message"></textarea>
<button class="btn">Send Message</button>
</form>
</section>

<div class="cart" onclick="openCart()">
🛒 <span class="cart-count" id="cartCount">0</span>
</div>

<div class="modal" id="cartModal">
<div class="modal-content">
<h3>Your Cart</h3>
<ul id="cartItems"></ul>
<p>Total: KES <span id="totalPrice">0</span></p>
<button class="btn" onclick="checkout()">Checkout</button>
<button class="btn" style="background:gray;margin-top:10px;" onclick="closeCart()">Close</button>
</div>
</div>

<footer>
<p>© 2026 Urban Flames | Nairobi, Kenya</p>
</footer>

<script>
let cart=[];
let total=0;

function scrollToMenu(){
document.getElementById("menu").scrollIntoView();
}

function addToCart(name,price){
cart.push({name,price});
total+=price;
document.getElementById("cartCount").innerText=cart.length;
alert(name+" added to cart!");
}

function openCart(){
document.getElementById("cartModal").style.display="flex";
updateCart();
}

function closeCart(){
document.getElementById("cartModal").style.display="none";
}

function updateCart(){
let cartItems=document.getElementById("cartItems");
cartItems.innerHTML="";
cart.forEach(item=>{
let li=document.createElement("li");
li.textContent=item.name+" - KES "+item.price;
cartItems.appendChild(li);
});
document.getElementById("totalPrice").innerText=total;
}

function checkout(){
alert("Order placed successfully! 🔥");
cart=[];
total=0;
document.getElementById("cartCount").innerText=0;
closeCart();
}

function submitForm(e){
e.preventDefault();
alert("Message sent successfully!");
}
</script>

</body>
</html>
